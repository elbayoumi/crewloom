name: Core checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 scripts/check_repository.py
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build

  isolated-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: docker pull python:3.14-slim
      - run: CREWLOOM_DOCKER_TESTS=1 python3 -m unittest discover -s scripts -p test_workflow.py
      - run: CREWLOOM_DOCKER_TESTS=1 python3 -m unittest discover -s scripts -p test_execution_policy.py
      - run: |
          mkdir -p /tmp/crewloom-submission/src
          cp examples/software-workflow/project/solution/slug.py /tmp/crewloom-submission/src/slug.py
          python3 scripts/evaluate_feature.py --project /tmp/crewloom-submission --repeats 3

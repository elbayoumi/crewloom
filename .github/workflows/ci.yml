name: Core checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Git's background maintenance can add object-store files while a fixture runs and race the
      # no-write snapshots and temporary-directory cleanup; fixtures read this global config.
      - run: git config --global gc.auto 0 && git config --global maintenance.auto false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: docker pull python:3.14-slim
      - run: python3 -m pip install '.[syntax]'
      - run: python3 scripts/check_repository.py
  dashboard:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build

  isolated-workflows:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Git's background maintenance can add object-store files while a fixture runs and race the
      # no-write snapshots and temporary-directory cleanup; fixtures read this global config.
      - run: git config --global gc.auto 0 && git config --global maintenance.auto false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: docker pull python:3.14-slim
      - run: CREWLOOM_DOCKER_TESTS=1 python3 -m unittest discover -s scripts -p test_workflow.py
      - run: CREWLOOM_DOCKER_TESTS=1 python3 -m unittest discover -s scripts -p test_execution_policy.py
      - run: python3 scripts/context_pilot.py --out /tmp/crewloom-pilot.json
      - run: |
          mkdir -p /tmp/crewloom-submission/src
          cp examples/software-workflow/project/solution/slug.py /tmp/crewloom-submission/src/slug.py
          python3 scripts/evaluate_feature.py --project /tmp/crewloom-submission --repeats 3

  coordinator:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Git's background maintenance can add object-store files while a fixture runs and race the
      # no-write snapshots and temporary-directory cleanup; fixtures read this global config.
      - run: git config --global gc.auto 0 && git config --global maintenance.auto false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: docker pull python:3.14-slim
      - name: Offline coordinator preflight, ownership and resume regressions
        run: python3 -m unittest discover -s scripts -p test_task_coordinator.py
      - name: Independent coordinator preflight and read-only acceptance
        run: |
            python3 -m unittest discover -s scripts -p test_coordinator_acceptance_boundaries.py
            python3 -m unittest discover -s scripts -p test_coordinator_readonly_boundaries.py
      - name: Real concurrent batch with reviewed publication
        env:
          CREWLOOM_DOCKER_TESTS: '1'
        run: python3 -m unittest discover -s scripts -p test_task_coordinator.py
      - name: Shared request admission across real worktrees
        env:
          CREWLOOM_DOCKER_TESTS: '1'
        run: python3 -m unittest discover -s scripts -p test_shared_admission.py
      - name: Complete development example with isolated acceptance and credential review
        env:
          CREWLOOM_DOCKER_TESTS: '1'
        run: python3 -m unittest discover -s scripts -p test_development_example.py

  case-insensitive-paths:
    timeout-minutes: 10
    # The alias boundaries reproduce a real bypass on a case-insensitive filesystem, so they are
    # proved on one; the two reserved-name cases still run everywhere.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Git's background maintenance can add object-store files while a fixture runs and race the
      # no-write snapshots and temporary-directory cleanup; fixtures read this global config.
      - run: git config --global gc.auto 0 && git config --global maintenance.auto false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python3 -m unittest discover -s scripts -p test_filesystem_alias_boundaries.py

  native-and-held-out-acceptance:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Git's background maintenance can add object-store files while a fixture runs and race the
      # no-write snapshots and temporary-directory cleanup; fixtures read this global config.
      - run: git config --global gc.auto 0 && git config --global maintenance.auto false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python3 -m pip install '.[syntax]'
      - run: docker pull python:3.14-slim
      - name: Real executor and held-out grader boundaries without provider calls
        env:
          CREWLOOM_DOCKER_TESTS: '1'
        run: |
            python3 -m unittest discover -s scripts -p test_host_lifecycle.py
            python3 -m unittest discover -s scripts -p test_context_study.py
            python3 -m unittest discover -s scripts -p test_bilingual_evaluation.py
            python3 -m unittest discover -s scripts -p 'test_study_*boundaries.py'

  distribution:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Git's background maintenance can add object-store files while a fixture runs and race the
      # no-write snapshots and temporary-directory cleanup; fixtures read this global config.
      - run: git config --global gc.auto 0 && git config --global maintenance.auto false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python3 -m pip install build 'setuptools>=77,<81' wheel
      - run: docker pull python:3.14-slim
      - name: Build from sdist, install and use outside checkout
        env:
          CREWLOOM_DISTRIBUTION_TESTS: '1'
        run: python3 -m unittest discover -s scripts -p test_distribution.py

  integration-protocols:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: git config --global gc.auto 0 && git config --global maintenance.auto false
      - run: python3 -m pip install '.[mcp]' 'playwright==1.63.0'
      - run: python3 -m playwright install --with-deps chromium
      - run: docker pull python:3.14-slim
      - name: Official MCP SDK round trips and isolated command acceptance
        env:
          CREWLOOM_MCP_TESTS: '1'
        run: |
          python3 -m unittest discover -s scripts -p test_mcp_bridge.py
          python3 -m unittest discover -s scripts -p test_chat_capture.py
      - name: Load the real Chrome extension in a headed browser
        env:
          CREWLOOM_REAL_BROWSER: '1'
        run: xvfb-run -a python3 -m unittest discover -s scripts -p test_sidepanel.py
